name: Daily Market Digest

on:
  # Manual trigger for testing
  workflow_dispatch:

  # Weekdays at 18:30 UTC = midnight IST (India market close)
  schedule:
    - cron: "30 18 * * 1-5"

permissions:
  contents: write   # needed to push to gh-pages branch

concurrency:
  group: daily-market-digest
  cancel-in-progress: false

jobs:
  generate:
    name: Generate & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout main branch ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so we can push to gh-pages

      # ── Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Run pipeline ──────────────────────────────────────────────────────
      - name: Run market digest pipeline
        env:
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_API_KEY:   ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TIINGO_API_KEY:          ${{ secrets.TIINGO_API_KEY }}
          RESEND_API_KEY:          ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL:                ${{ secrets.TO_EMAIL }}
          FROM_EMAIL:              ${{ secrets.FROM_EMAIL }}
          PYTHONPATH:              ${{ github.workspace }}
        run: python src/main.py --log-level INFO

      # ── Commit updated glossary.json back to main ─────────────────────────
      - name: Commit glossary updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add glossary.json
          if git diff --staged --quiet; then
            echo "No glossary changes"
          else
            git commit -m "chore: update glossary.json [$(date -u +%Y-%m-%d)]"
            git push origin main
          fi

      # ── Deploy generated/ to gh-pages branch ─────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/generated
          publish_branch: gh-pages
          commit_message: "deploy: market digest $(date -u +%Y-%m-%d)"
          force_orphan: false   # preserve history in gh-pages
